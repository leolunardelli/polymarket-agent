name: Production Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: true
        type: string

env:
  NODE_VERSION: '18'

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Verify version
        run: |
          VERSION=$(cat package.json | grep -o '"version": "[^"]*' | cut -d'"' -f4)
          echo "Package version: $VERSION"
          echo "Requested version: ${{ github.event.inputs.version }}"
          if [ "$VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "Version mismatch!"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r "POLYMARKET_API_KEY\|PRIVATE_KEY\|PASSWORD" src/ \
            --include="*.ts" --include="*.js" \
            | grep -v "env\|process\|config" && exit 1 || echo "No hardcoded secrets found"

  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, security-check]
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm run test:run

      - name: Generate deployment manifest
        run: |
          cat > deployment-manifest.json <<EOF
          {
            "version": "${{ github.event.inputs.version }}",
            "environment": "${{ github.event.inputs.environment }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v3
        with:
          name: deployment-manifest
          path: deployment-manifest.json

      - name: Notify deployment
        run: |
          echo "🚀 Deploying version ${{ github.event.inputs.version }} to ${{ github.event.inputs.environment }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo ""
          echo "Deployment manifest generated:"
          cat deployment-manifest.json

  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    if: success()

    steps:
      - name: Download deployment manifest
        uses: actions/download-artifact@v3
        with:
          name: deployment-manifest

      - name: Verify deployment
        run: |
          echo "✅ Deployment verified"
          cat deployment-manifest.json
